services:
  - type: web
    name: medical-terminology-practice-tool
    runtime: python
    plan: free
    rootDir: 04-medical-coding-practice-tool
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RENDER
        value: "true"
